name: CI

on:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run API integration tests
        run: npm test --workspace=apps/api
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          TABLE_NAME: JobTracker-test
      - name: Run web unit tests
        run: npm test --workspace=apps/web

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=apps/api
      - uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist/

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    env:
      VITE_USER_POOL_ID: placeholder
      VITE_USER_POOL_CLIENT_ID: placeholder
      VITE_COGNITO_DOMAIN: placeholder
      VITE_API_URL: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=apps/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/

  synth-cdk:
    name: CDK Synth
    runs-on: ubuntu-latest
    needs: [build-api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist/
      - name: CDK assertion tests
        run: npm test --workspace=infra/cdk
      - run: npm run synth --workspace=infra/cdk
        env:
          # Synth with placeholder values; real values injected at deploy time
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: ca-west-1
