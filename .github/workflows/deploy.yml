name: Deploy Frontend

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Frontend to AWS S3
    runs-on: ubuntu-latest
    needs: [] # runs independently; CI is a separate workflow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build web
        run: npm run build --workspace=apps/web
        env:
          VITE_API_URL: https://u4uc1mbng1.execute-api.ca-west-1.amazonaws.com/prod
          VITE_USER_POOL_ID: ca-west-1_f843JG0eB
          VITE_USER_POOL_CLIENT_ID: 2f5sfj2jls26cvlu497a82jhi2
          VITE_COGNITO_DOMAIN: ghosted-app.auth.ca-west-1.amazoncognito.com
          VITE_AUTH_BYPASS: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::560628764360:role/ghosted-github-deploy
          aws-region: ca-west-1

      - name: Sync to S3
        run: aws s3 sync apps/web/dist s3://ghosted-spa-560628764360 --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E39RZ394V448CO \
            --paths "/*"
